services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-financeiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: controle
      # Senha de desenvolvimento local, descartável. Em qualquer outro ambiente a string
      # de conexão inteira vem de variável de ambiente e nunca é versionada.
      POSTGRES_PASSWORD: controle_local
    ports:
      - "5432:5432"
    volumes:
      - dados-do-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-do-postgres:
