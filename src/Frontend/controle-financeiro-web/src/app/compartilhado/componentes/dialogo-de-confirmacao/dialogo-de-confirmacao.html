<h2 mat-dialog-title>{{ dados.titulo }}</h2>

<mat-dialog-content>
  <p>{{ dados.mensagem }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [class.acao-destrutiva]="dados.ehDestrutiva"
    (click)="confirmar()"
    cdkFocusInitial
  >
    {{ dados.rotuloDeConfirmacao ?? 'Confirmar' }}
  </button>
</mat-dialog-actions>
