<div class="filtro-de-despesas" [formGroup]="formulario">
  <mat-form-field subscriptSizing="dynamic" class="campo-busca">
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      formControlName="texto"
      placeholder="Buscar por descrição, categoria, observação ou pagamento"
      autocomplete="off"
    />
    @if (formulario.controls.texto.value) {
      <button
        matSuffix
        mat-icon-button
        type="button"
        aria-label="Limpar busca"
        (click)="limparTexto()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <mat-form-field subscriptSizing="dynamic" class="campo-categorias">
    <mat-label>Categoria</mat-label>
    <mat-select formControlName="categoriaIds" multiple>
      @for (categoria of categorias(); track categoria.id) {
        <mat-option [value]="categoria.id">
          <span class="ponto-de-cor" [style.background-color]="categoria.corHexadecimal"></span>
          {{ categoria.nome }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (temFiltroAtivo()) {
    <button mat-button type="button" class="botao-limpar" (click)="limparTudo()">
      <mat-icon>filter_alt_off</mat-icon>
      Limpar filtros
    </button>
  }
</div>
